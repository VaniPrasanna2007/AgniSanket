version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: sih_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sih_thermal_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: sih_thermal_api
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql://postgres:postgrespassword@db:5432/sih_thermal_db
    depends_on:
      - db

volumes:
  postgis_data:
